<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects — Icon Grid Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --ink:#111111; --muted:#777777; --line:#E2E2E2; --cursor:#F2C641;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{cursor:none;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Space Mono',monospace;
    min-height:100%; overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}

  /* custom cursor — hollow ring at rest, fills solid + label on hover */
  #cur{position:fixed; top:0; left:0; width:0; height:0; pointer-events:none; z-index:999;}
  #cur-dot{position:absolute; top:0; left:0; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
    border-radius:50%; border:1px solid var(--cursor); background:transparent;
    transition:background .12s, transform .12s;}
  #cur.view #cur-dot{background:var(--cursor); transform:scale(.85);}
  #cur.pulse #cur-dot{transform:scale(.6);}
  #cur-label{position:absolute; top:0; left:0; margin:-4px 0 0 11px;
    font-family:'Space Mono',monospace; font-size:8px; letter-spacing:.14em; white-space:nowrap;
    color:var(--cursor); opacity:0; transform:translateX(-3px); transition:opacity .12s,transform .12s;}
  #cur.view #cur-label{opacity:1; transform:translateX(0);}

  header{position:relative; display:flex; justify-content:space-between; align-items:flex-start; padding:28px 40px 24px;
    font-size:12px; letter-spacing:.02em;}
  .site-name{font-size:12px; letter-spacing:.08em;}
  .mark{position:absolute; top:34px; left:50%; transform:translateX(-50%); width:10px; height:10px; background:var(--cursor);}
  .menu{position:absolute; top:28px; right:40px; display:flex; flex-direction:column; align-items:flex-end; gap:38px;}
  .menu a{font-size:12px; letter-spacing:.1em; color:var(--ink); transition:opacity .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1);}
  .menu a.current{color:var(--ink);}
  .menu a.exit{opacity:0; transform:translateX(120px);}
  .menu a.hide{opacity:0; pointer-events:none; transition:opacity .2s ease;}

  .back-arrow{position:fixed; top:52px; left:22px; font-size:12px; color:var(--ink);
    opacity:0; pointer-events:none; transition:opacity .35s ease .35s, transform .35s ease .35s;
    transform:translateX(-4px); z-index:400;}
  .back-arrow.show{opacity:1; pointer-events:auto; transform:translateX(0);}

  .page-title{position:fixed; top:52px; left:40px; margin:0; font-family:'Space Mono',monospace;
    font-weight:400; font-size:12px; letter-spacing:.1em; color:var(--ink);
    transform-origin:0 0; opacity:0; pointer-events:none; z-index:500;}
  .page-title.settled{color:var(--ink);}

  main{max-width:1100px; margin:0 auto; padding:56px 40px 100px;}
  .label{font-size:11px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:40px;}

  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:56px 40px;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;}
  .grid.show{opacity:1; transform:translateY(0); pointer-events:auto;}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.grid{grid-template-columns:1fr; gap:44px;}}

  .item{display:flex; flex-direction:column; align-items:center; text-align:center;}
  .icon-box{width:100%; max-width:130px; aspect-ratio:1/1; border:1px solid var(--line); position:relative; overflow:hidden;}
  .icon-box svg{width:100%; height:100%; display:block; color:var(--ink);}
  .wash{position:absolute; inset:0; opacity:0; transition:opacity .2s;}
  .item:hover .wash{opacity:.16;}
  .name{margin-top:12px; font-family:'Special Elite',monospace; font-size:16px; letter-spacing:.03em;}
  .meta{font-size:10px; color:var(--muted); letter-spacing:.06em; margin-top:2px;}
  .rule{width:0; height:2px; margin-top:6px; transition:width .25s;}
  .item:hover .rule{width:36px;}

  footer{padding:40px; font-size:10px; color:var(--muted); text-align:center;}
</style>
</head>
<body>
<div id="cur">
  <div id="cur-dot"></div>
  <span id="cur-label">VIEW</span>
</div>

  <div class="site-name">ANDREEA HALIP</div>
  <div class="mark"></div>
  <nav class="menu">
    <a href="#" id="nav-projects" class="current">PROJECTS</a>
    <a href="#">PHOTOS</a>
    <a href="#">CONTACT</a>
    <a href="#">INFO</a>
  </nav>
</header>

<a href="#" class="back-arrow" id="backArrow" aria-label="Back to menu">←</a>

<footer>hand-sketch icon system — hover any square · reference: sferaarhitectura.com grid rhythm</footer>

<script>
  const cur = document.getElementById('cur');
  window.addEventListener('mousemove', e=>{ cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px'; });
  document.querySelectorAll('.icon-box, .menu a, .back-arrow').forEach(el=>{
    el.addEventListener('mouseenter',()=>{ cur.classList.add('view'); });
    el.addEventListener('mouseleave',()=>{ cur.classList.remove('view'); });
  });
  document.addEventListener('mousedown',()=>cur.classList.add('pulse'));
  document.addEventListener('mouseup',()=>cur.classList.remove('pulse'));

  /* PROJECTS nav item -> page title transition (FLIP). Arrow (or clicking again) reverses it. */
  const navProjects = document.getElementById('nav-projects');
  const pageTitle = document.getElementById('page-title');
  const backArrow = document.getElementById('backArrow');
  const grid = document.getElementById('grid');
  const otherLinks = document.querySelectorAll('.menu a:not(#nav-projects)');
  let animating = false;
  let selected = false;

  function goToTitle(){
    if (animating || selected) return;
    animating = true;

    const sourceRect = navProjects.getBoundingClientRect();
    const sourceFontSize = parseFloat(getComputedStyle(navProjects).fontSize);

    pageTitle.textContent = 'PROJECTS';
    pageTitle.style.transition = 'none';
    pageTitle.style.opacity = '1';

    const targetRect = pageTitle.getBoundingClientRect();
    const targetFontSize = parseFloat(getComputedStyle(pageTitle).fontSize);
    const scale = sourceFontSize / targetFontSize;
    const dx = sourceRect.left - targetRect.left;
    const dy = sourceRect.top - targetRect.top;
    const startTransform = `translate(${dx}px, ${dy}px) scale(${scale})`;

    pageTitle.style.transform = startTransform;
    pageTitle.classList.remove('settled');
    navProjects.classList.add('hide');
    otherLinks.forEach((a,i) => setTimeout(()=> a.classList.add('exit'), i*40));

    pageTitle.offsetHeight; // force reflow before transitioning

    requestAnimationFrame(()=>{
      pageTitle.style.transition = 'transform .7s cubic-bezier(.22,1,.36,1), color .3s ease .45s';
      pageTitle.style.transform = 'translate(0,0) scale(1)';
      pageTitle.classList.add('settled');
      backArrow.classList.add('show');
    });

    setTimeout(()=> grid.classList.add('show'), 200);
    setTimeout(()=>{ animating = false; selected = true; }, 700);
  }

  function backToMenu(){
    if (animating || !selected) return;
    animating = true;

    const targetRect = pageTitle.getBoundingClientRect();
    const targetFontSize = parseFloat(getComputedStyle(pageTitle).fontSize);
    const navRect = navProjects.getBoundingClientRect();
    const navFontSize = parseFloat(getComputedStyle(navProjects).fontSize);
    const scale = navFontSize / targetFontSize;
    const dx = navRect.left - targetRect.left;
    const dy = navRect.top - targetRect.top;

    pageTitle.style.transition = 'transform .6s cubic-bezier(.22,1,.36,1), opacity .3s ease .25s, color .2s ease';
    pageTitle.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    pageTitle.style.opacity = '0';
    pageTitle.classList.remove('settled');
    backArrow.classList.remove('show');
    grid.classList.remove('show');
    navProjects.classList.remove('hide');
    otherLinks.forEach((a,i) => setTimeout(()=> a.classList.remove('exit'), i*40));

    setTimeout(()=>{ pageTitle.style.transition = 'none'; animating = false; selected = false; }, 650);
  }

  navProjects.addEventListener('click', e=>{ e.preventDefault(); goToTitle(); });
  backArrow.addEventListener('click', e=>{ e.preventDefault(); backToMenu(); });
</script>
</body>
</html>
